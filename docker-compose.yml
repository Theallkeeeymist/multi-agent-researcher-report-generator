version: '3.8'

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD} 
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    
  api:
    build: .
    command: uvicorn src.api.routes:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=${REDIS_URL}
      - DATABASE_URL=${POSTGRES_DB_URL}
    env_file:
      - .env 
    depends_on:
      - redis
      - db

  worker:
    build: .
    command: celery -A src.api.routes.celery_app worker --loglevel=info
    environment:
      - REDIS_URL=${REDIS_URL}
      - DATABASE_URL=${POSTGRES_DB_URL}
    env_file:
      - .env
    depends_on:
      - redis
      - db