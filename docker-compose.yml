version: '3.8'

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  db:
    image: postgres:15
    environment:
      - POSTGRES_USER: postgres
      - POSTGRES_PASSWORD: password 
      - POSTGRES_DB: langgraph_state
    ports:
      - "5432:5432"
    
  api:
    build: .
    command: uvicorn src.api.routes:app --host 0.0.0.0 --port 8000
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://postgres:password@db:5432/langgraph_state
    env_file:
      - .env 
    depends_on:
      - redis
      - db

  worker:
    build: .
    command: celery -A src.api.routes.celery_app worker --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://postgres:password@db:5432/langgraph_state
    env_file:
      - .env
    depends_on:
      - redis
      - db