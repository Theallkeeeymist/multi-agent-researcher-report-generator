version: "3.8"

services:
  # Reverse Proxy and Edge Load Balancer
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
      # - "443:443" # Used when adding SSL certificates
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api 
    restart: always

  # FastAPI Backend (Scaled via Uvicorn Workers)
  api:
    build: .
    command: uvicorn src.api.routes:app --host 0.0.0.0 --port 8000 --workers 4
    expose:
      - "8000"
    environment:
      - POSTGRES_DB_URL=${PGBOUNCER_URL}
      - REDIS_URL=${REDIS_URL}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
    depends_on:
      - pgbouncer 
      - redis 
    restart: always

  # Distributed Celery Workers (Scale to 4+ replicas)
  worker:
    build: .
    command: celery -A src.celery_app worker --loglevel=info --concurrency=4
    environment:
      - POSTGRES_DB_URL=${PGBOUNCER_URL}
      - REDIS_URL=${REDIS_URL}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
    depends_on:
      - pgbouncer
      - redis
    restart: always
    deploy:
      replicas: 4 # Spins up 4 separate worker containers

  # Connection Pooler (Protects PostgreSQL from connection exhaustion)
  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      - DB_URL=${DATABASE_URL}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=10000
      - DEFAULT_POOL_SIZE=50
    expose:
      - "5432"
    depends_on:
      - db 
    restart: always
  
  # Core PostgreSQL Database
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data 
    restart: always

  # High Performance Task Queue
  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data_prod:/data
    restart: always

# Fixed Indentation
volumes:
  postgres_data_prod:
  redis_data_prod: